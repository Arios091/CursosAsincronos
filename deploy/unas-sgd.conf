<VirtualHost *:80>
    ServerName sgd.unas.edu.pe
    ServerAdmin admin@unas.edu.pe

    # Redirigir a HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName sgd.unas.edu.pe
    ServerAdmin admin@unas.edu.pe
    DocumentRoot /var/www/sgd/public

    <Directory /var/www/sgd/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /var/log/httpd/sgd-error.log
    CustomLog /var/log/httpd/sgd-access.log combined

    # SSL
    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/sgd-unas-educ-pe.crt
    SSLCertificateKeyFile /etc/pki/tls/private/sgd-unas-educ-pe.key
    SSLCertificateChainFile /etc/pki/tls/certs/sgd-unas-educ-pe.ca-bundle
</VirtualHost>
